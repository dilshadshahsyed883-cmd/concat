# Standalone Concat Web HTTPS location; injected only by guarded adoption.
# Do not trust browser-supplied identity or Scene session headers.
location / {
    proxy_pass http://127.0.0.1:18873;
    proxy_http_version 1.1;
    proxy_connect_timeout 5s;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_request_buffering off;
    proxy_buffering off;
    client_max_body_size 12g;
    client_body_timeout 600s;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Port 443;
    proxy_set_header Connection "";
    proxy_set_header Authorization "";
    proxy_set_header Forwarded "";
    proxy_set_header X-Forwarded-Host "";
    proxy_set_header X-Auth-User "";
    proxy_set_header X-Is-Admin "";
    proxy_set_header X-App-Access "";
    proxy_set_header X-Forwarded-User "";
    proxy_set_header X-Authenticated-User "";
    proxy_set_header X-Remote-User "";
    proxy_set_header X-Scene-User "";
    proxy_set_header X-User "";
    proxy_set_header X-Admin "";
}
