# Concat Web: dedicated HTTPS virtual host (template, NOT installed by CI).
# Replaces the obsolete Scene SSO proxy example. Standalone local-admin auth
# is performed by the FastAPI app; Nginx MUST NOT create trusted identity.
#
# These two literal placeholders MUST be replaced by the guarded cutover
# tool after certificate and private-key validation:
#   certificate full-chain path
#   matching private-key path
#
# Install only as a new Concat-specific site. Do not edit Scene/VPS1 blocks.
server {
    listen 80;
    server_name concat.scenebuilder.online;
    return 308 https://concat.scenebuilder.online$request_uri;
}

server {
    listen 443 ssl;
    server_name concat.scenebuilder.online;
    ssl_certificate __CONCAT_TLS_FULLCHAIN__;
    ssl_certificate_key __CONCAT_TLS_PRIVKEY__;
    ssl_protocols TLSv1.2 TLSv1.3;

    # Avoid logging query strings containing OAuth codes or other credentials.
    access_log off;
    error_log /var/log/nginx/concat-web-error.log warn;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;

    client_max_body_size 12g;
    client_body_timeout 600s;

    location / {
        # Port 18873 is bound to loopback by the independent Concat service.
        proxy_pass http://127.0.0.1:18873;
        proxy_http_version 1.1;
        proxy_connect_timeout 5s;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_request_buffering off;
        proxy_buffering off;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Port 443;
        proxy_set_header Connection "";

        # Do not pass browser-supplied identity claims into the reused apps.
        # The Concat gateway injects identity ONLY after server session check.
        proxy_set_header Authorization "";
        proxy_set_header Forwarded "";
        proxy_set_header X-Forwarded-Host "";
        proxy_set_header X-Auth-User "";
        proxy_set_header X-Is-Admin "";
        proxy_set_header X-App-Access "";
        proxy_set_header X-Forwarded-User "";
        proxy_set_header X-Authenticated-User "";
        proxy_set_header X-Remote-User "";
        proxy_set_header X-Scene-User "";
        proxy_set_header X-User "";
        proxy_set_header X-Admin "";
    }
}
