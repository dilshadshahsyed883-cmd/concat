<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark"><title>Sign in · Concat Web</title>
<style>
:root{font-family:system-ui,Arial,sans-serif;color-scheme:dark}*{box-sizing:border-box}
body{min-height:100vh;display:grid;place-items:center;background:#0b1220;color:#eef2ff;margin:0;padding:20px}
form{width:100%;max-width:410px;padding:30px;border:1px solid #334155;border-radius:18px;background:#111b2c;box-shadow:0 20px 80px #0005}
h1{margin:0 0 8px;font-size:26px}p{color:#a9b7cc;font-size:14px;margin:0 0 28px}
label{display:block;margin:14px 0 8px;font-size:14px}
input{width:100%;background:#101827;color:#fff;border:1px solid #50627f;border-radius:8px;padding:13px;font-size:16px}
input:focus{outline:2px solid #60a5fa;outline-offset:2px}
button{margin-top:24px;width:100%;padding:14px;background:#2563eb;border:0;border-radius:9px;color:white;font-weight:700;cursor:pointer}
small{display:block;margin-top:20px;color:#a9b7cc}
</style></head><body>
<form action="/auth/login" method="post" autocomplete="on">
<h1>Concat Web</h1><p>Secure, independent administrator sign-in</p>
<input type="hidden" name="csrf" value="{{ csrf }}">
<label for="username">Username</label>
<input id="username" name="username" required autocomplete="username" maxlength="64" autofocus>
<label for="password">Password</label>
<input id="password" name="password" type="password" required autocomplete="current-password" maxlength="1024">
<button type="submit">Sign in</button>
<small>Private admin access. Your credentials stay on this server.</small>
</form></body></html>
