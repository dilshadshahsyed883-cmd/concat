name: Concat Web essential checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: concat-web-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -e '.[test]'
      - name: Source syntax
        run: python -m compileall -q app run.py reused
      - name: Fail-closed shell and copied Concat source contracts
        run: |
          python -m unittest discover -s tests -p 'test_foundation.py' -v
          python -m unittest discover -s tests -p 'test_reused_*.py' -v
          python -m unittest app.modules.concat.test_routes -v
          python -m unittest discover -s tests -p 'test_concat_drive_intake.py' -v
          python -m unittest discover -s tests -p 'test_salad_auto_worker.py' -v
          python -m unittest discover -s tests -p 'test_concat_outputs_upload.py' -v
          python -m unittest discover -s app/modules/uploader/tests -p 'test_*.py' -v
      - name: Browser shell JavaScript syntax
        run: |
          node --check app/static/app.js
          node --check app/modules/concat/assets/cloud_render.js
          node tests/js/salad_auto_worker.test.js
      - name: Thumbnail browser limit regressions
        run: node tests/js/thumbnail_limits.test.js
      - name: Uploader JavaScript regressions
        run: |
          node --check reused/uploader/part01/static/concat_media_picker.js
          node tests/js/channel_picker.test.js
          node tests/js/concat_media_picker.test.js
          node --check reused/uploader/part01/static/concat_metadata.js
          node tests/js/concat_metadata.test.js
      - name: Concat Media desktop and mobile browser regressions
        run: |
          python -m pip install playwright==1.62.0
          python -m playwright install --with-deps chromium
          python tests/browser/concat_media_picker_layout.py
      - name: VPS1-style Concat shell UX and authentication regressions
        run: python -m unittest discover -s tests -p 'test_scene_shell_ui.py' -v
      - name: Release script syntax (no SSH or deployment)
        run: |
          bash -n deploy/guarded-release.sh
          bash -n deploy/manual-integration-release.sh
      - name: Local-admin manual release security contract (offline only)
        run: python -m unittest discover -s tests -p 'test_release_security_contract.py' -v
      - name: Concat-only Nginx HTTPS routing contract (offline only)
        run: |
          bash -n deploy/nginx-cutover.sh
          python -m unittest discover -s tests -p 'test_nginx_routing.py' -v
          python -m unittest discover -s tests -p 'test_nginx_existing_adoption.py' -v
      - name: Production-only installed wheel uploader import smoke
        run: |
          set -Eeuo pipefail
          python -m venv /tmp/concat-runtime-only
          /tmp/concat-runtime-only/bin/python -m pip install --disable-pip-version-check --no-input .
          # -I prevents the checkout and test extras masking missing prod deps.
          /tmp/concat-runtime-only/bin/python -I tests/smoke_uploader_production.py
      - name: Wheel build smoke
        run: python -m pip wheel --no-deps --wheel-dir /tmp/concat-web-wheel .
