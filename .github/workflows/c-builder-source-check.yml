name: C Builder source verification (no EXE)

on:
  push:
    branches:
      - feature/c-builder-native-library-timeline-20261108
      - work/consolidated-concat-20261108
    paths:
      - 'upstream/src/crates/concat/src/c_builder.rs'
      - 'upstream/src/crates/concat/src/studio/bulk_presets.rs'
      - 'upstream/src/crates/concat/tests/test_ui_animation_captions_contract.py'
      - 'upstream/src/crates/concat/src/lib.rs'
      - 'upstream/src/crates/concat/src/studio.rs'
      - 'upstream/src/crates/concat/ui/**'
      - '.github/workflows/c-builder-source-check.yml'
  pull_request:
    paths:
      - 'upstream/src/crates/concat/src/c_builder.rs'
      - 'upstream/src/crates/concat/src/lib.rs'
      - 'upstream/src/crates/concat/src/studio.rs'
      - 'upstream/src/crates/concat/ui/**'
      - '.github/workflows/c-builder-source-check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  syntax-and-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f
        with:
          toolchain: '1.93.0'
          components: rustfmt
      - name: Parse Rust source (no compile, no executable)
        shell: bash
        run: |
          rustfmt --edition 2024 --emit stdout upstream/src/crates/concat/src/c_builder.rs > /dev/null
          rustfmt --edition 2024 --emit stdout upstream/src/crates/concat/src/lib.rs > /dev/null
          rustfmt --edition 2024 --emit stdout upstream/src/crates/concat/src/studio.rs > /dev/null
          rustfmt --edition 2024 --emit stdout upstream/src/crates/concat/src/studio/bulk_presets.rs > /dev/null
      - name: Verify embedded app wiring, source safety and persistent caching
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          root = Path('upstream/src/crates/concat')
          engine = (root/'src/c_builder.rs').read_text()
          lib = (root/'src/lib.rs').read_text()
          studio = (root/'src/studio.rs').read_text()
          ui = (root/'ui/workspace/c-builder.slint').read_text()
          media = (root/'ui/workspace/media-pane.slint').read_text()
          editor = (root/'ui/editor.slint').read_text()
          seat = (root/'ui/workspace/seat.slint').read_text()
          required = {
            engine: ['fn scan(', 'fn plan(', 'fn validate(', 'fn write_native(', 'modified_ns',
                     'read_cache(', 'save_cache(', 'doc::to_document(', 'doc::from_document(',
                     'native_project_reopens_and_original_media_is_not_moved'],
            lib: ['mod c_builder;', 'editor.on_cb_import_folder', 'editor.on_cb_refresh_folder',
                  'editor.on_cb_choose_narration', 'editor.on_cb_generate_project', 'c_builder_scan'],
            studio: ['pub c_builder:', 'set_cb_media_folder(', 'set_cb_scan_done('],
            ui: ['Media Library', 'Timeline Builder', 'Generate Native Concat Timeline'],
            media: ['CBuilderPane', 'import-folder => { root.cb-import-folder(); }', 'cb-generate-project('],
            editor: ['callback cb-import-folder()', 'callback cb-generate-project('],
            seat: ['Editor.cb-import-folder()', 'Editor.cb-generate-project('],
          }
          for content, needles in required.items():
              for needle in needles:
                  assert needle in content, f'Missing C Builder integration {needle}'
          assert 'fs::remove_file(source)' not in engine
          assert 'os.link(' not in engine
          assert 'std::process::Command' not in engine
          print('C Builder source contracts PASS — no Windows executable built')
          PY
      - name: Validate Animations tab and Captions UI source contracts
        run: python3 upstream/src/crates/concat/tests/test_ui_animation_captions_contract.py

  rust-and-slint-typecheck:
    name: Concat Rust + Slint library typecheck (no EXE)
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      ORT_VERSION: 1.28.0
      CARGO_PROFILE_DEV_DEBUG: "0"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f
        with:
          toolchain: "1.93.0"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          workspaces: upstream/src
          cache-on-failure: true
      - name: System development libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libfontconfig1-dev libfreetype6-dev libxkbcommon-dev \
            libgl1-mesa-dev libgtk-3-dev libasound2-dev libclang-dev cmake \
            libvulkan1 mesa-vulkan-drivers
      - name: Pinned FFmpeg 7 development dependencies
        working-directory: upstream
        run: |
          scripts/ci/fetch.sh ffmpeg-linux64 ffmpeg.tar.xz
          mkdir -p ffmpeg-dev
          tar -xf ffmpeg.tar.xz -C ffmpeg-dev --strip-components=1
          echo "FFMPEG_DIR=$PWD/ffmpeg-dev" >> "$GITHUB_ENV"
      - name: ONNX Runtime dependency
        working-directory: upstream
        run: |
          stem="onnxruntime-linux-x64-$ORT_VERSION"
          scripts/ci/fetch.sh onnxruntime-linux-x64 onnxruntime.tgz
          tar -xzf onnxruntime.tgz
          ln -sf "libonnxruntime.so.$ORT_VERSION" "$stem/lib/libonnxruntime.so"
          {
            echo "ORT_LIB_LOCATION=$PWD/$stem/lib"
            echo "ORT_PREFER_DYNAMIC_LINK=1"
            echo "LD_LIBRARY_PATH=$PWD/ffmpeg-dev/lib:$PWD/$stem/lib"
          } >> "$GITHUB_ENV"
      - name: sherpa-onnx dependency
        working-directory: upstream
        run: |
          version=$(grep -A1 'name = "sherpa-onnx-sys"' src/Cargo.lock | sed -n 's/^version = "\(.*\)"/\1/p')
          scripts/ci/fetch.sh sherpa-onnx-linux-x64-static-lib sherpa.tar.bz2
          mkdir -p sherpa
          tar -xjf sherpa.tar.bz2 -C sherpa
          stem="sherpa-onnx-v$version-linux-x64-static-lib"
          echo "SHERPA_ONNX_LIB_DIR=$PWD/sherpa/$stem/lib" >> "$GITHUB_ENV"
      - name: Check Concat application/library + Slint bindings (no EXE artifact)
        working-directory: upstream/src
        run: cargo check -p concat --lib --locked -j 2
      - name: Run native C Builder mixed-media and bulk editor regression tests
        working-directory: upstream/src
        run: |
          cargo test -p concat --lib --locked -j 2 c_builder::tests
          cargo test -p concat --lib --locked -j 2 studio::bulk_presets::tests
