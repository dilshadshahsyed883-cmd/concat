name: Concat planned features source tests
on:
  push:
    branches: [integration/planned-features-source-20261117]
  pull_request:
    paths: ['upstream/src/crates/**', 'cloud_render/concat/**', 'tools/**', '.github/workflows/concat-planned-source.yml']
permissions:
  contents: read
jobs:
  source-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CONCAT_CANVAS_FIXTURE_DIR: /tmp/concat-canvas-fixtures
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f
        with:
          toolchain: '1.93.0'
          components: rustfmt
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r cloud_render/concat/hybrid/requirements-captions.txt numpy==2.2.6
      - name: Rust project, compatibility and undo tests
        working-directory: upstream/src
        run: cargo test --locked -p concat-project --features schema --lib
      - name: Native glyph rendering and complete effect catalogue fixtures
        working-directory: upstream/src
        run: |
          cargo test --locked -p concat-text --lib
          cargo test --locked -p concat-effects --lib --test creative_pack
      - name: Real C Builder cached planner and document-writing tests (probe IO unavailable)
        run: cargo test --locked --manifest-path tools/cbuilder-source-check/Cargo.toml
      - name: Compile complete Slint tree without linking the application
        run: cargo check --locked --manifest-path tools/slint-source-check/Cargo.toml
      - name: Rust syntax and new module formatting
        run: |
          rustfmt --edition 2024 --check upstream/src/crates/concat-project/src/planning.rs upstream/src/crates/concat-project/src/commands/editing.rs
          for module in upstream/src/crates/concat/src/{c_builder,lib,studio}.rs; do
            rustfmt --edition 2024 --emit stdout "$module" > /dev/null
          done
      - name: Worker and desktop source regressions
        run: |
          python -m compileall -q cloud_render/concat
          python -m unittest discover -v -s cloud_render/concat/tests
          python upstream/src/crates/concat/tests/test_ui_animation_captions_contract.py
