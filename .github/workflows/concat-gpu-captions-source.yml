name: Concat GPU captions source-only regression tests
on:
  push:
    branches: ['feat/gpu-captions-final']
    paths:
      - 'cloud_render/concat/gpu/caption_jobs.py'
      - 'cloud_render/concat/gpu/worker.py'
      - 'cloud_render/concat/gpu/Dockerfile'
      - 'cloud_render/concat/tests/test_gpu_caption_jobs.py'
      - '.github/workflows/concat-gpu-captions-source.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  captions-source-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install CPU-only deterministic test dependencies
        run: python -m pip install Pillow==12.0.0 numpy==2.2.6
      - name: Check source syntax
        run: python -m py_compile cloud_render/concat/gpu/caption_jobs.py cloud_render/concat/gpu/worker.py cloud_render/concat/tests/test_gpu_caption_jobs.py
      - name: Run mocked ASR, caption renderer and worker API tests (no Docker or GPU)
        run: python -m unittest -v cloud_render.concat.tests.test_gpu_caption_jobs cloud_render.concat.tests.test_gpu_worker
