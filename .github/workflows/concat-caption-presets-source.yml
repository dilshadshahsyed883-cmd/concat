name: Concat caption presets source-only regression
on:
  push:
    branches: ['fix/caption-preset-ui-71']
    paths:
      - 'upstream/src/crates/concat/src/studio.rs'
      - 'upstream/src/crates/concat/src/studio/caption_preview.rs'
      - 'upstream/src/crates/concat/src/presets.rs'
      - 'upstream/src/crates/concat-project/src/commands/editing.rs'
      - 'upstream/src/crates/concat-project/src/gpu_captions.rs'
      - 'upstream/src/crates/concat/tests/test_caption_preset_ui_71.py'
      - 'cloud_render/concat/tests/test_caption_preset_2.py'
      - '.github/workflows/concat-caption-presets-source.yml'
permissions:
  contents: read
jobs:
  caption-source-regressions:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f
        with:
          toolchain: '1.93.0'
          components: rustfmt
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install deterministic caption fixture dependencies
        run: python -m pip install -r cloud_render/concat/hybrid/requirements-captions.txt numpy==2.2.6
      - name: Python source and nine-caption UI contracts
        run: |
          python -m compileall -q cloud_render/concat
          python upstream/src/crates/concat/tests/test_caption_preset_ui_71.py
          python -m unittest -v cloud_render.concat.tests.test_caption_preset_2 cloud_render.concat.tests.test_project_bundle
      - name: Native caption schema, save/reopen, Undo/Redo and artifact tests
        working-directory: upstream/src
        run: |
          cargo test --locked -p concat-project --features schema --lib caption_preset_settings_tests
          cargo test --locked -p concat-project --features schema --lib gpu_captions
      - name: Slint complete source tree syntax (no app build)
        run: cargo check --locked --manifest-path tools/slint-source-check/Cargo.toml
      - name: Rust source parse only (no EXE)
        run: |
          rustfmt --edition 2024 --emit stdout upstream/src/crates/concat/src/studio.rs > /dev/null
          rustfmt --edition 2024 --emit stdout upstream/src/crates/concat-project/src/gpu_captions.rs > /dev/null
          rustfmt --edition 2024 --emit stdout upstream/src/crates/concat-project/src/commands/editing.rs > /dev/null
