name: Concat Linux verification

on:
  push:
    branches: ['gpu/**', '!gpu/final-integration', 'desktop/whole-timeline-filter-presets']
    paths: ['cloud_render/concat/**', 'upstream/src/crates/concat*/**', '.github/workflows/concat-linux.yml']
  pull_request:
    paths: ['cloud_render/concat/**', '.github/workflows/concat-linux.yml']

permissions:
  contents: read

concurrency:
  group: concat-linux-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  worker-tests:
    if: github.head_ref != 'gpu/final-integration'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f
        with:
          toolchain: "1.93.0"
          components: rustfmt
      - name: Parse random GPU Rust module before native Windows compilation
        run: rustfmt --edition 2024 --emit stdout upstream/src/crates/concat/src/studio/bulk_presets.rs > /dev/null
      - run: python -m pip install -r cloud_render/concat/hybrid/requirements-captions.txt
      - name: Parse desktop filter editor changes without building an EXE
        run: rustfmt --edition 2024 --emit stdout upstream/src/crates/concat/src/studio.rs > /dev/null
      - name: Verify native physics keyframes (no Windows EXE build)
        working-directory: upstream/src
        run: cargo test -p concat-project --lib physics_motion --locked
      - name: Parse modified desktop Rust modules without making an EXE
        run: |
          for module in upstream/src/crates/concat/src/cloud_gpu_queue.rs \
                        upstream/src/crates/concat/src/gpu_queue_model.rs \
                        upstream/src/crates/concat/src/panes/captions.rs \
                        upstream/src/crates/concat-speech/src/transcribe.rs \
                        upstream/src/crates/concat-project/src/physics_motion.rs; do
            rustfmt --edition 2024 --emit stdout "$module" > /dev/null
          done
      - run: python -m compileall -q cloud_render/concat
      - name: Desktop background uploads and Recent Projects regressions
        run: |
          python upstream/src/crates/concat/tests/test_cloud_gpu_background_uploads.py
          python upstream/src/crates/concat/tests/test_recent_projects_menu.py
      - run: python -m unittest discover -v -s cloud_render/concat/tests
  worker-image:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    if: github.ref_name == 'gpu/baseline' || github.ref_name == 'gpu/integration' || github.event.pull_request.head.ref == 'gpu/integration'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: docker build -t concat-worker:ci -f cloud_render/concat/gpu/Dockerfile .
      - run: docker run --rm --entrypoint python3 concat-worker:ci -c 'from cloud_render.concat.gpu.worker import RenderWorker'
