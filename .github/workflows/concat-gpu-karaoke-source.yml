name: Concat tolerant karaoke source tests
on:
  push:
    branches: ['fix/gpu-karaoke-segment-timing-20261121']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install deterministic test dependencies
        run: python -m pip install Pillow==12.0.0 numpy==2.2.6
      - name: Validate syntax
        run: python -m compileall -q cloud_render/concat/gpu tests/test_gpu_karaoke_timing.py
      - name: Alignment, cache and worker regressions
        run: |
          set -Eeuo pipefail
          python -m unittest discover -s tests -p 'test_gpu_asr_alignment.py' -v
          python -m unittest discover -s tests -p 'test_gpu_karaoke_timing.py' -v
          python -m unittest discover -s tests -p 'test_gpu_asr_image_bundle.py' -v
          python -m unittest cloud_render.concat.tests.test_gpu_caption_jobs -v
