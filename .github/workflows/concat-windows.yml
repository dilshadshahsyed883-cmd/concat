name: Concat native development build

on:
  push:
    branches: ['main', 'gpu/baseline', 'gpu/desktop-editor', 'gpu/integration', 'gpu/integrated', 'gpu/final-integration', 'desktop/queue-bulk']
    paths: ['upstream/**', '.github/workflows/concat-windows.yml']
  pull_request:
    paths: ['upstream/**', '.github/workflows/concat-windows.yml']

permissions:
  contents: read

concurrency:
  group: concat-windows-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  native-editor-windows:
    runs-on: windows-2022
    timeout-minutes: 190
    env:
      ORT_VERSION: 1.28.0
      GGML_NATIVE: "OFF"
      GGML_AVX2: "OFF"
      GGML_FMA: "OFF"
      GGML_F16C: "OFF"
      GGML_BMI2: "OFF"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify embedded GPU bundle contract
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $client = "upstream/src/crates/concat/src/concat_gpu_client.ps1"
          $errors = $null
          $tokens = $null
          $ast = [Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path $client).Path, [ref]$tokens, [ref]$errors
          )
          if ($errors.Count) { $errors | Format-List; throw "PowerShell GPU client syntax invalid" }
          New-Item -ItemType Directory -Force fixture | Out-Null
          [IO.File]::WriteAllBytes("fixture\photo.jpg", [byte[]](1..120))
          '{"media":[{"id":"m1","path":"photo.jpg","kind":"image"}]}' |
            Set-Content -LiteralPath "fixture\concat.json" -Encoding UTF8
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File $client -ProjectDir fixture -BundleOnly -BundlePath "$pwd\fixture\bundle.zip"
          if ($LASTEXITCODE -ne 0) { throw "Native Concat offline ZIP packaging failed" }
          python -c "import json,zipfile,hashlib; z=zipfile.ZipFile('fixture/bundle.zip'); x=json.loads(z.read('bundle.json')); r=x['references'][0]; assert x['version']==1 and x['project_file']=='concat.json'; assert hashlib.sha256(z.read(r['member'])).hexdigest()==r['sha256']; assert z.read('project/concat.json')"
          if ($LASTEXITCODE -ne 0) { throw "Generated Concat ZIP contract rejected" }
          Write-Host "Native Concat ZIP integrity PASS"
          $originalLocalData = $env:LOCALAPPDATA
          try {
            $env:LOCALAPPDATA = Join-Path $pwd "fixture\local-data"
            $job = "concat-cuda-1234567890abcdef"
            $queue = Join-Path $env:LOCALAPPDATA "Concat\GPU\Queue"
            $snapshot = Join-Path $queue $job
            New-Item -ItemType Directory -Force -Path $snapshot | Out-Null
            Copy-Item -LiteralPath "fixture\concat.json" -Destination (Join-Path $snapshot "concat.json")
            '{"media":[]}' | Set-Content -LiteralPath "fixture\concat.json" -Encoding UTF8
            powershell.exe -NoProfile -ExecutionPolicy Bypass -File $client -Operation Prepare -ProjectDir fixture -Job $job -SnapshotID $job
            if ($LASTEXITCODE -ne 0) { throw "Offline queue snapshot failed" }
            $archive = Join-Path $queue "$job.zip"
            python -c "import json,sys,zipfile; z=zipfile.ZipFile(sys.argv[1]); assert json.loads(z.read('project/concat.json').decode('utf-8-sig'))['media'][0]['id']=='m1'" $archive
            if ($LASTEXITCODE -ne 0) { throw "Queue used the edited project instead of its saved snapshot" }
            $hash = (Get-FileHash -LiteralPath $archive).Hash
            powershell.exe -NoProfile -ExecutionPolicy Bypass -File $client -Operation Prepare -ProjectDir fixture -Job $job -SnapshotID $job
            if ($LASTEXITCODE -ne 0 -or (Get-FileHash -LiteralPath $archive).Hash -ne $hash) {
              throw "Queue preparation did not reuse the existing snapshot"
            }
            Write-Host "Offline queue snapshot and retry PASS"
          } finally { $env:LOCALAPPDATA = $originalLocalData }
      - name: Exact Rust 1.93 toolchain
        uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f
        with:
          toolchain: "1.93.0"
          targets: x86_64-pc-windows-msvc
      - name: Windows pinned LLVM + FFmpeg development runtime
        working-directory: upstream
        shell: pwsh
        timeout-minutes: 20
        run: |
          $ErrorActionPreference = "Stop"
          $bash = "$env:ProgramFiles\Git\bin\bash.exe"
          & $bash scripts/ci/fetch.sh llvm-win64 llvm.exe
          if ($LASTEXITCODE -ne 0) { throw "Pinned LLVM fetch failed" }
          Start-Process -Wait -FilePath .\llvm.exe -ArgumentList "/S", "/D=C:\llvm"
          if (-not (Test-Path "C:\llvm\bin\libclang.dll")) { throw "LLVM install missing libclang" }
          "C:\llvm\bin" | Out-File -FilePath $env:GITHUB_PATH -Append
          "LIBCLANG_PATH=C:\llvm\bin" | Out-File -FilePath $env:GITHUB_ENV -Append
          & $bash scripts/ci/fetch.sh ffmpeg-win64 ffmpeg-win.zip
          if ($LASTEXITCODE -ne 0) { throw "Pinned FFmpeg fetch failed" }
          Expand-Archive ffmpeg-win.zip -DestinationPath ffdl
          $dir=(Get-ChildItem ffdl -Directory | Select-Object -First 1).FullName
          if (-not (Test-Path "$dir\bin")) { throw "FFmpeg dev binary path missing" }
          "FFMPEG_DIR=$dir" | Out-File -FilePath $env:GITHUB_ENV -Append
          "$dir\bin" | Out-File -FilePath $env:GITHUB_PATH -Append
      - name: Windows pinned ONNX shared runtime
        working-directory: upstream
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          & "$env:ProgramFiles\Git\bin\bash.exe" scripts/ci/fetch.sh onnxruntime-win-x64 onnxruntime.zip
          if ($LASTEXITCODE -ne 0) { throw "ONNX download failed" }
          Expand-Archive onnxruntime.zip -DestinationPath .
          $dir="$PWD\onnxruntime-win-x64-$env:ORT_VERSION"
          if (-not (Test-Path "$dir\lib\onnxruntime.lib")) { throw "Missing ONNX import library" }
          "ORT_LIB_LOCATION=$dir\lib" | Out-File -FilePath $env:GITHUB_ENV -Append
          "ORT_PREFER_DYNAMIC_LINK=1" | Out-File -FilePath $env:GITHUB_ENV -Append
          "ORT_DIR=$dir" | Out-File -FilePath $env:GITHUB_ENV -Append
          "$dir\lib" | Out-File -FilePath $env:GITHUB_PATH -Append
      - name: Windows pinned sherpa-onnx shared libraries
        working-directory: upstream
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $version=(Select-String -Path src\Cargo.lock -Pattern 'name = "sherpa-onnx-sys"' -Context 0,1).Context.PostContext[0] -replace '.*"(.*)".*', '$1'
          $name="sherpa-onnx-win-x64-shared-MT-Release-lib"
          $stem="sherpa-onnx-v$version-win-x64-shared-MT-Release-lib"
          $bash="$env:ProgramFiles\Git\bin\bash.exe"
          & $bash scripts/ci/fetch.sh $name sherpa.tar.bz2
          if ($LASTEXITCODE -ne 0) { throw "sherpa download failed" }
          python -c "import tarfile; t=tarfile.open('sherpa.tar.bz2'); t.extractall(**({'filter':'data'} if hasattr(tarfile,'data_filter') else {}))"
          if (-not (Test-Path "$stem\lib")) { throw "sherpa shared libs missing" }
          New-Item -ItemType Directory -Force sherpa-libs, sherpa-dlls | Out-Null
          Copy-Item "$stem\lib\sherpa-onnx-*.lib" sherpa-libs\
          Copy-Item "$stem\lib\sherpa-onnx-*.dll" sherpa-dlls\
          "SHERPA_ONNX_LIB_DIR=$PWD\sherpa-libs" | Out-File -FilePath $env:GITHUB_ENV -Append
          "SHERPA_DLL_DIR=$PWD\sherpa-dlls" | Out-File -FilePath $env:GITHUB_ENV -Append
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          workspaces: upstream/src
          key: windows-concat-quick-v028
          cache-on-failure: true
          env-vars: CARGO CC CFLAGS CXX CMAKE RUST ORT
      - name: Compile modified original Concat GUI from source
        env:
          # ffmpeg-sys-the-third's libclang binding generator repeatedly
          # terminated with Windows 0xc0000005 under unconstrained parallel
          # dependency builds. Limit simultaneous builds and incremental
          # memory usage; retain the pinned FFmpeg and LLVM versions.
          CARGO_BUILD_JOBS: '2'
          CARGO_INCREMENTAL: '0'
          # The unoptimized GUI retains Whisper symbols only present in its static CPU library.
          GGML_BACKEND_DL: "OFF"
          GGML_CPU_ALL_VARIANTS: "OFF"
        working-directory: upstream/src
        timeout-minutes: 95
        shell: pwsh
        run: |
          cargo build --locked --profile quick -p concat --target x86_64-pc-windows-msvc
          if ($LASTEXITCODE -ne 0) { throw "Native Concat GUI build failed" }
      - name: Package portable edited Concat EXE and required DLLs
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $out="dist\Concat-0.2.8-GPU-Windows-x64"
          New-Item -ItemType Directory -Force $out | Out-Null
          Copy-Item "upstream\src\target\x86_64-pc-windows-msvc\quick\concat.exe" "$out\concat.exe"
          Copy-Item "$env:FFMPEG_DIR\bin\*.dll" $out
          Copy-Item "$env:SHERPA_DLL_DIR\*.dll" $out
          Copy-Item "$env:ORT_DIR\lib\*.dll" $out
          Copy-Item "upstream\LICENSE", "upstream\THIRD_PARTY_NOTICES.md" $out
          Copy-Item "README.md" $out
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -products * -property installationPath
          $crt = Get-ChildItem "$vs\VC\Redist\MSVC\*\x64\Microsoft.VC14*.CRT" -Directory |
            Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $crt) { throw "Visual C++ x64 redistributable missing" }
          Copy-Item "$($crt.FullName)\*.dll" $out
          $env:CONCAT_GPU = "software"
          & ".\upstream\scripts\ci\smoke-windows.ps1" -Bundle $out
          $hash = (Get-FileHash "$out\concat.exe" -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  concat.exe" | Set-Content -LiteralPath "$out\SHA256SUMS" -Encoding ascii
          Get-ChildItem $out -File | Select-Object Name,Length | Format-Table
      - name: Test project editing and persistence
        if: github.ref_name != 'gpu/final-integration' && github.head_ref != 'gpu/final-integration'
        working-directory: upstream/src
        run: cargo test --locked -p concat-project --target x86_64-pc-windows-msvc
      - uses: actions/upload-artifact@v4
        with:
          name: Concat-Windows-x64-dev
          path: dist/Concat-0.2.8-GPU-Windows-x64/
          if-no-files-found: error
          retention-days: 30

  publish-main-release:
    needs: native-editor-windows
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Concat-Windows-x64-dev
          path: Concat-0.2.8-GPU-Windows-x64
      - name: Package verified portable Windows release
        shell: bash
        run: |
          set -euo pipefail
          test -s Concat-0.2.8-GPU-Windows-x64/concat.exe
          test -s Concat-0.2.8-GPU-Windows-x64/SHA256SUMS
          cd Concat-0.2.8-GPU-Windows-x64
          sha256sum -c SHA256SUMS
          cd ..
          zip -r "Concat-Windows-x64-${GITHUB_SHA:0:12}.zip" Concat-0.2.8-GPU-Windows-x64
          sha256sum "Concat-Windows-x64-${GITHUB_SHA:0:12}.zip" > release-sha256.txt
      - name: Publish commit-matched GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag="concat-cuda-${GITHUB_SHA:0:12}"
          {
            echo "Portable Windows x64 Concat editor built and smoke-tested from main commit ${GITHUB_SHA}."
            echo
            echo "Salad GPU candidate (same source commit):"
            echo "`ghcr.io/${GITHUB_REPOSITORY,,}-gpu-candidate:${GITHUB_SHA}`"
            echo
            echo "GPU RTX 3060 Ti acceptance is pending a live test; this release does not claim GPU acceptance."
          } > release-notes.txt
          gh release create "$tag" "Concat-Windows-x64-${GITHUB_SHA:0:12}.zip" release-sha256.txt \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "Concat CUDA Desktop ${GITHUB_SHA:0:12}" --notes-file release-notes.txt
